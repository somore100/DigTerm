name: Check

# Fast safety net on every push and pull request: the UI smoke test (no Rust build needed).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ui-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:ui
